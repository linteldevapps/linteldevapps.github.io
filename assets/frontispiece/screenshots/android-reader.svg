    <g transform="translate(50 46)"><rect x="0" y="0" width="440" height="988" rx="34" fill="#faf3e5" stroke-width="1"/><text x="24" y="48" fill="#8a7764" font-size="14" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Chapter 14</text><text x="350" y="48" fill="#8a7764" font-size="15" font-weight="800" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Aa</text><text x="220" y="112" fill="#252a32" font-size="29" font-weight="700" font-family="Georgia, serif" text-anchor="middle">The quiet work</text><text x="54" y="176" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">Frontispiece keeps the page calm</text><text x="54" y="218" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">while every reading event syncs</text><text x="54" y="260" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">in the background. The reader is</text><text x="54" y="302" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">built for long sessions, offline</text><text x="54" y="344" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">downloads, and cross-device</text><text x="54" y="386" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">progress recovery.</text><text x="54" y="470" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">Status slots can show progress,</text><text x="54" y="512" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">time left, chapter position, or</text><text x="54" y="554" fill="#31343a" font-size="21" font-weight="400" font-family="Georgia, serif">a simple clock.</text><rect x="54" y="814" width="332" height="8" rx="4" fill="#d7c8b7" stroke-width="1"/><rect x="54" y="814" width="208" height="8" rx="4" fill="#2f7a6b" stroke-width="1"/><text x="54" y="850" fill="#5f5141" font-size="13" font-weight="800" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">63%</text><text x="386" y="850" fill="#5f5141" font-size="13" font-weight="800" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="end">32 min left</text><rect x="122" y="894" width="196" height="42" rx="21" fill="#27313d" stroke-width="1"/><text x="220" y="921" fill="#d6eee5" font-size="13" font-weight="800" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Synced just now</text></g>
    
